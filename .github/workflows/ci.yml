name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: 型チェック
        run: npm run typecheck
      - name: 外部通信チェック
        run: npm run check:offline
      - name: テスト
        run: npm test
      - name: ビルド
        run: npm run build
